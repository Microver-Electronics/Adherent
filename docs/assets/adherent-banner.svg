<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">Adherent360 APDU — system engineering</title>
  <desc id="desc">70 conveyor lanes, 10 lane controllers, 4 controller roles. R27 design review baseline.</desc>
